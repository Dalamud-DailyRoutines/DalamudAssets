name: Upload Assets to R2
on:
  push:
    branches: [cn]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: 'Asset version'
        type: string
        required: false

jobs:
  upload:
    name: Upload to R2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Determine version
        id: meta
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            echo "Version (from caller): $VERSION"
          else
            VERSION=$(jq -r '.Version' assetCN.json)
            echo "Version (from file): $VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload RELEASE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo -n "${{ steps.meta.outputs.version }}" > RELEASE
          npx wrangler r2 object put dalamud-distribute/assets/RELEASE \
            --remote \
            --file RELEASE \
            --cache-control 'public, max-age=300'

      - name: Upload assetCN.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler r2 object put "dalamud-distribute/assets/${{ steps.meta.outputs.version }}/assetCN.json" \
            --remote \
            --file assetCN.json \
            --cache-control 'public, max-age=31536000, immutable'

      - name: Upload UIRes files
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          find UIRes -type f | while IFS= read -r file; do
            echo "Uploading: $file"
            npx wrangler r2 object put "dalamud-distribute/assets/${{ steps.meta.outputs.version }}/files/${file}" \
              --remote \
              --file "$file" \
              --cache-control 'public, max-age=31536000, immutable'
          done

      - name: Cleanup old versions (keep latest 5)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CURRENT=${{ steps.meta.outputs.version }}
          CUTOFF=$((CURRENT - 5))
          if [ "$CUTOFF" -lt 1 ]; then
            echo "Not enough versions to clean (current=$CURRENT)"
            exit 0
          fi

          KEYS=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/dalamud-distribute/objects?prefix=assets/&limit=1000" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result.objects[].key')

          for v in $(seq 1 "$CUTOFF"); do
            PREFIX="assets/$v/"
            COUNT=$(echo "$KEYS" | grep -c "^$PREFIX" || true)
            if [ "$COUNT" -gt 0 ]; then
              echo "Deleting old asset version: $v ($COUNT objects)"
              echo "$KEYS" | grep "^$PREFIX" | while IFS= read -r key; do
                npx wrangler r2 object delete "dalamud-distribute/$key" --remote
              done
            fi
          done
          echo "Cleanup done"
