name: Upload Assets to R2
on:
  push:
    branches: [cn]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: 'Asset version'
        type: string
        required: false

jobs:
  upload:
    name: Upload to R2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Determine version
        id: meta
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            echo "Version (from caller): $VERSION"
          else
            VERSION=$(jq -r '.Version' assetCN.json)
            echo "Version (from file): $VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Upload metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          retry() { local n=0; until "$@"; do n=$((n+1)); [ $n -ge 3 ] && return 1; echo "Retry $n/3..."; sleep 3; done; }
          VERSION="${{ steps.meta.outputs.version }}"

          echo -n "$VERSION" > RELEASE
          retry wrangler r2 object put dalamud-distribute/assets/RELEASE \
            --remote --file RELEASE --cache-control 'public, max-age=300'

          retry wrangler r2 object put "dalamud-distribute/assets/$VERSION/assetCN.json" \
            --remote --file assetCN.json --cache-control 'public, max-age=31536000, immutable'

      - name: Upload UIRes files
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          retry() { local n=0; until "$@"; do n=$((n+1)); [ $n -ge 3 ] && return 1; echo "Retry $n/3..."; sleep 3; done; }
          VERSION="${{ steps.meta.outputs.version }}"

          upload_file() {
            local f="$1"
            retry wrangler r2 object put "dalamud-distribute/assets/$VERSION/files/$f" \
              --remote --file "$f" --cache-control 'public, max-age=31536000, immutable'
          }
          export -f upload_file retry
          export VERSION CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID

          find UIRes -type f | xargs -P 4 -I {} bash -c 'upload_file "$@"' _ {}

      - name: Cleanup old versions (keep latest 5)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CURRENT=${{ steps.meta.outputs.version }}
          CUTOFF=$((CURRENT - 5))
          if [ "$CUTOFF" -lt 1 ]; then
            echo "Not enough versions to clean (current=$CURRENT)"
            exit 0
          fi

          KEYS=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/dalamud-distribute/objects?prefix=assets/&limit=1000" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[].key')

          for v in $(seq 1 "$CUTOFF"); do
            PREFIX="assets/$v/"
            COUNT=$(echo "$KEYS" | grep -c "^$PREFIX" || true)
            if [ "$COUNT" -gt 0 ]; then
              echo "Deleting old asset version: $v ($COUNT objects)"
              echo "$KEYS" | grep "^$PREFIX" | while IFS= read -r key; do
                retry wrangler r2 object delete "dalamud-distribute/$key" --remote
              done
            fi
          done
          echo "Cleanup done"
