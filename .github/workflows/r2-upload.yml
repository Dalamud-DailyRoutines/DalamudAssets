name: Upload Assets to R2
on:
  push:
    branches: [cn]
  workflow_dispatch:
  workflow_call:

jobs:
  upload:
    name: Upload to R2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read version from assetCN.json
        id: meta
        run: |
          VERSION=$(jq -r '.Version' assetCN.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Upload RELEASE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo -n "${{ steps.meta.outputs.version }}" > RELEASE
          npx wrangler r2 object put dalamud-distribute/assets/RELEASE \
            --remote \
            --file RELEASE \
            --cache-control 'public, max-age=300'

      - name: Upload assetCN.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler r2 object put "dalamud-distribute/assets/${{ steps.meta.outputs.version }}/assetCN.json" \
            --remote \
            --file assetCN.json \
            --cache-control 'public, max-age=300'

      - name: Upload UIRes files
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          find UIRes -type f | while IFS= read -r file; do
            echo "Uploading: $file"
            npx wrangler r2 object put "dalamud-distribute/assets/${{ steps.meta.outputs.version }}/files/${file}" \
              --remote \
              --file "$file" \
              --cache-control 'public, max-age=31536000, immutable'
          done
