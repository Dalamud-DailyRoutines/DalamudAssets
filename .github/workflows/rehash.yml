name: Rehash Assets
on: workflow_dispatch

jobs:
  generate:
    name: Rehash Assets
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.out.outputs.version }}
    steps:
      - uses: actions/setup-python@v2
        with:
            python-version: '3.10'
      - name: Checkout ${{ github.ref }}
        uses: actions/checkout@v2
        with:
          ref: ${{ github.ref }}

      - name: Bump version if assets changed
        run: |
          OLD=$(jq -r '.Assets[] | "\(.FileName) \(.Hash)"' assetCN.json 2>/dev/null | sort)
          NEW=""
          for f in $(find UIRes -type f | sort); do
            HASH=$(sha1sum "$f" | awk '{print toupper($1)}')
            NEW="$NEW$f $HASH"$'\n'
          done
          NEW=$(echo "$NEW" | sort)
          if [ "$OLD" != "$NEW" ]; then
            VERSION=$(jq -r '.Version' assetCN.json)
            NEW_VERSION=$((VERSION + 1))
            jq --arg v "$NEW_VERSION" '.Version = ($v | tonumber)' assetCN.json > tmp.json && mv tmp.json assetCN.json
            echo "资源文件有变化，version bumped: $VERSION -> $NEW_VERSION"
          else
            echo "资源文件无变化，version 不变"
          fi

      - name: Hash assetCN.json
        run: python hash.py

      - name: Output version
        id: out
        run: |
          VERSION=$(jq -r '.Version' assetCN.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Rehash Assets" || true
          git push origin "${{ github.ref }}"

  upload-r2:
    name: Upload to R2
    needs: generate
    uses: ./.github/workflows/r2-upload.yml
    with:
      version: ${{ needs.generate.outputs.version }}
    secrets: inherit
