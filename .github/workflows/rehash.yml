name: Rehash Assets
on: 
  push:
    branches:
      - cn
  workflow_dispatch:

jobs:
  generate:
    name: Rehash Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v2
        with:
            python-version: '3.10'
      - name: Checkout ${{ github.ref }}
        uses: actions/checkout@v2
        with:
          ref: ${{ github.ref }}
      - name: Bump version if assets changed
        run: |
          # 读取旧清单
          OLD=$(jq -r '.Assets[] | "\(.FileName) \(.Hash)"' assetCN.json 2>/dev/null | sort)

          # 扫描当前 UIRes 文件并计算 SHA1
          NEW=""
          for f in $(find UIRes -type f | sort); do
            HASH=$(sha1sum "$f" | awk '{print toupper($1)}')
            NEW="$NEW$f $HASH"$'\n'
          done
          NEW=$(echo "$NEW" | sort)

          if [ "$OLD" != "$NEW" ]; then
            VERSION=$(jq -r '.Version' assetCN.json)
            NEW_VERSION=$((VERSION + 1))
            jq --arg v "$NEW_VERSION" '.Version = ($v | tonumber)' assetCN.json > tmp.json && mv tmp.json assetCN.json
            echo "资源文件有变化，version bumped: $VERSION -> $NEW_VERSION"
          else
            echo "资源文件无变化，version 不变"
          fi

      - name: Hash assetCN.json
        run: python hash.py
      - name: Commit files
        continue-on-error: true
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Rehash Assets"
      - name: Push changes
        continue-on-error: false
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

  upload-r2:
    name: Upload to R2
    needs: generate
    uses: ./.github/workflows/r2-upload.yml
    secrets: inherit