name: Rehash Assets
on: 
  push:
    branches:
      - cn
  workflow_dispatch:

jobs:
  generate:
    name: Rehash Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v2
        with:
            python-version: '3.10'
      - name: Checkout ${{ github.ref }}
        uses: actions/checkout@v2
        with:
          ref: ${{ github.ref }}
      - name: Bump version if UIRes changed
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Initial push, no parent to diff — assuming UIRes changed"
            CHANGED=true
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" | grep -q '^UIRes/' && echo true || echo false)
          fi

          if [ "$CHANGED" = "true" ]; then
            VERSION=$(jq -r '.Version' assetCN.json)
            NEW_VERSION=$((VERSION + 1))
            jq --arg v "$NEW_VERSION" '.Version = ($v | tonumber)' assetCN.json > tmp.json && mv tmp.json assetCN.json
            echo "UIRes changed, version bumped: $VERSION -> $NEW_VERSION"
          else
            echo "No UIRes changes, version unchanged"
          fi

      - name: Hash assetCN.json
        run: python hash.py
      - name: Commit files
        continue-on-error: true
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Rehash Assets"
      - name: Push changes
        continue-on-error: false
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

  upload-r2:
    name: Upload to R2
    needs: generate
    uses: ./.github/workflows/r2-upload.yml
    secrets: inherit