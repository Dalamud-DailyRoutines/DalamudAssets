name: Upload Assets to CNB
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: 'Asset version'
        type: string
        required: false

jobs:
  upload:
    name: Upload to CNB
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Determine version
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            echo "Version (from caller): $VERSION"
          else
            VERSION=$(jq -r '.Version' assetCN.json)
            echo "Version (from file): $VERSION"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid asset version: $VERSION"
            exit 1
          fi

          MANIFEST_VERSION=$(jq -r '.Version' assetCN.json)
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "::error::Manifest version $MANIFEST_VERSION does not match requested version $VERSION"
            exit 1
          fi

          while IFS= read -r file; do
            if [ ! -f "$file" ]; then
              echo "::error::Manifest asset does not exist: $file"
              exit 1
            fi
          done < <(jq -r '.Assets[].FileName' assetCN.json)

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync RELEASE file to CNB repo
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          ASSET_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          VERSION="$ASSET_VERSION"
          CNB_REPO="https://cnb.cool/atmoomen/dalamud-asset-distribute.git"
          CNB_PUSH="https://cnb:$CNB_TOKEN@cnb.cool/atmoomen/dalamud-asset-distribute.git"

          git clone --depth 1 "$CNB_REPO" cnb-repo
          cd cnb-repo

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          printf '%s' "$VERSION" > RELEASE
          git add RELEASE
          git commit -m "release: $VERSION" || echo "Nothing to commit"
          git push "$CNB_PUSH" HEAD:master

      - name: Publish CNB Release with assets
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          ASSET_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -e

          VERSION="$ASSET_VERSION"
          API="https://api.cnb.cool"
          REPO="atmoomen/dalamud-asset-distribute"
          AUTH="Authorization: Bearer $CNB_TOKEN"
          ACCEPT="Accept: application/vnd.cnb.api+json"
          HEADERS=(-H "$AUTH" -H "$ACCEPT" -H "Content-Type: application/json")

          echo "::group::Check existing release"
          EXISTING=$(curl -sf "${HEADERS[@]}" "$API/$REPO/-/releases/tags/$VERSION" || true)
          if [ -n "$EXISTING" ]; then
            OLD_ID=$(echo "$EXISTING" | jq -r '.id')
            echo "Found existing release id=$OLD_ID, deleting..."
            curl -sf -X DELETE "${HEADERS[@]}" "$API/$REPO/-/releases/$OLD_ID"
            echo "Old release deleted."
          else
            echo "No existing release with tag $VERSION."
          fi
          echo "::endgroup::"

          echo "::group::Create CNB Release"
          RELEASE_PAYLOAD=$(jq -nc --arg version "$VERSION" '{tag_name: $version, name: $version, body: ("Release " + $version), target_commitish: "master", prerelease: false, make_latest: "true"}')
          HTTP_RESP=$(mktemp)
          HTTP_CODE=$(curl -s -o "$HTTP_RESP" -w "%{http_code}" -X POST "${HEADERS[@]}" \
            -d "$RELEASE_PAYLOAD" \
            "$API/$REPO/-/releases")
          RELEASE_RESP=$(<"$HTTP_RESP")
          rm -f "$HTTP_RESP"
          echo "HTTP status: $HTTP_CODE"
          echo "Response: $RELEASE_RESP"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Failed to create CNB Release (HTTP $HTTP_CODE)"
            exit 1
          fi
          RELEASE_ID=$(echo "$RELEASE_RESP" | jq -r '.id')
          echo "Release created: id=$RELEASE_ID, tag=$VERSION"
          echo "::endgroup::"

          upload_asset() {
            local ASSET_FILE="$1"
            local ASSET_NAME="$2"
            local FILE_SIZE
            FILE_SIZE=$(stat -c%s "$ASSET_FILE")

            echo "::group::Upload $ASSET_NAME ($FILE_SIZE bytes)"

            local UPLOAD_PAYLOAD
            UPLOAD_PAYLOAD=$(jq -nc --arg name "$ASSET_NAME" --argjson size "$FILE_SIZE" '{asset_name: $name, size: $size, overwrite: true}')
            local UPLOAD_RESP_TMP
            UPLOAD_RESP_TMP=$(mktemp)
            local UPLOAD_HTTP
            UPLOAD_HTTP=$(curl -s -o "$UPLOAD_RESP_TMP" -w "%{http_code}" \
              -X POST "${HEADERS[@]}" \
              -d "$UPLOAD_PAYLOAD" \
              "$API/$REPO/-/releases/$RELEASE_ID/asset-upload-url")
            local UPLOAD_RESP
            UPLOAD_RESP=$(<"$UPLOAD_RESP_TMP")
            rm -f "$UPLOAD_RESP_TMP"

            if [ "$UPLOAD_HTTP" -ge 400 ]; then
              echo "::error::Failed to get upload URL (HTTP $UPLOAD_HTTP)"
              echo "Response: $UPLOAD_RESP"
              exit 1
            fi

            local UPLOAD_URL
            UPLOAD_URL=$(echo "$UPLOAD_RESP" | jq -r '.upload_url')
            local VERIFY_URL
            VERIFY_URL=$(echo "$UPLOAD_RESP" | jq -r '.verify_url')
            local UPLOAD_TOKEN
            UPLOAD_TOKEN=$(echo "$VERIFY_URL" | sed -E 's|.*/asset-upload-confirmation/([^/]+)/.*|\1|')
            local ASSET_PATH
            ASSET_PATH=$(echo "$VERIFY_URL" | sed -E 's|.*/asset-upload-confirmation/[^/]+/(.*)|\1|')

            local PUT_CODE
            PUT_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT -T "$ASSET_FILE" -H "$AUTH" "$UPLOAD_URL")
            if [ "$PUT_CODE" -ge 400 ]; then
              echo "::error::File upload failed: HTTP $PUT_CODE for $ASSET_NAME"
              exit 1
            fi
            echo "PUT upload: HTTP $PUT_CODE"

            local CONF_RESP_TMP
            CONF_RESP_TMP=$(mktemp)
            local CONF_HTTP
            CONF_HTTP=$(curl -s -o "$CONF_RESP_TMP" -w "%{http_code}" \
              -X POST "${HEADERS[@]}" \
              "$API/$REPO/-/releases/$RELEASE_ID/asset-upload-confirmation/$UPLOAD_TOKEN/$ASSET_PATH")
            local CONF_RESP
            CONF_RESP=$(<"$CONF_RESP_TMP")
            rm -f "$CONF_RESP_TMP"

            if [ "$CONF_HTTP" -ge 400 ]; then
              echo "::error::Upload confirmation failed: HTTP $CONF_HTTP"
              echo "Response: $CONF_RESP"
              exit 1
            fi

            echo "::endgroup::"
            echo "$ASSET_NAME uploaded successfully."
          }

          upload_asset assetCN.json "assetCN.json"
          while IFS= read -r file; do
            upload_asset "$file" "files/$file"
          done < <(jq -r '.Assets[].FileName' assetCN.json)

      - name: Cleanup old releases
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          API="https://api.cnb.cool"
          REPO="atmoomen/dalamud-asset-distribute"
          AUTH="Authorization: Bearer $CNB_TOKEN"
          ACCEPT="Accept: application/vnd.cnb.api+json"
          HEADERS=(-H "$AUTH" -H "$ACCEPT")

          mapfile -t RELEASES < <(curl -sf "${HEADERS[@]}" "$API/$REPO/-/releases?page_size=100" | \
            jq -r '[.[] | select(.tag_name | test("^[0-9]+$"))] | sort_by(.tag_name | tonumber) | .[].tag_name')

          KEEP=5
          TOTAL=${#RELEASES[@]}
          if [ "$TOTAL" -le "$KEEP" ]; then
            echo "Only $TOTAL releases, nothing to clean. (keep=$KEEP)"
            exit 0
          fi

          DELETE_COUNT=$((TOTAL - KEEP))
          echo "Keep latest $KEEP releases:"
          printf '%s\n' "${RELEASES[@]:DELETE_COUNT}"

          for tag in "${RELEASES[@]:0:DELETE_COUNT}"; do
            echo "::group::Deleting release: $tag"
            REL=$(curl -sf "${HEADERS[@]}" "$API/$REPO/-/releases/tags/$tag" || true)
            if [ -n "$REL" ]; then
              REL_ID=$(echo "$REL" | jq -r '.id')
              curl -sf -X DELETE "${HEADERS[@]}" "$API/$REPO/-/releases/$REL_ID"
              echo "Deleted release $tag (id=$REL_ID)"
            fi
            echo "::endgroup::"
          done
